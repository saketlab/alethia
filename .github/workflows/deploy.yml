name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.dirs.outputs.web }}
      r: ${{ steps.dirs.outputs.r }}
      docs: ${{ steps.dirs.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      # Gate on everything a job needs, not one marker file: a partial add would
      # otherwise start a job that cannot finish.
      - id: dirs
        run: |
          have() { for f in "$@"; do [ -e "$f" ] || { echo false; return; }; done; echo true; }
          {
            echo "web=$(have web/package.json web/package-lock.json web/src web/index.html)"
            echo "r=$(have R/DESCRIPTION R/R R/man R/_pkgdown.yml)"
            echo "docs=$(have mkdocs.yml docs overrides scripts/build_docs.sh python/pyproject.toml)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  python-docs:
    needs: detect
    if: needs.detect.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "./python[docs]"
      # Notebooks render from committed outputs (mkdocs-jupyter execute=false),
      # so no embedding backend is installed here.
      - run: scripts/build_docs.sh --strict
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # --mkpath: rsync will not create cli/ on a fresh docroot
          switches: -avzr --delete --mkpath
          path: site/
          remote_path: ${{ secrets.HOSTINGER_REMOTE_PATH }}/cli/python
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: ${{ secrets.HOSTINGER_PORT }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

  r-docs:
    needs: detect
    if: needs.detect.outputs.r == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R
          extra-packages: any::pkgdown, local::.
          needs: website
      - run: Rscript -e 'pkgdown::build_site(".", preview = FALSE, install = FALSE)'
        working-directory: R
      # pkgdown renders every root .md; these are not site content.
      - run: rm -f R/docs/CLAUDE.html R/docs/diff.html
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --mkpath
          path: R/docs/
          remote_path: ${{ secrets.HOSTINGER_REMOTE_PATH }}/cli/R
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: ${{ secrets.HOSTINGER_PORT }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npx vite build
        working-directory: web
      # ONNX Runtime uses multi-threaded wasm only in a cross-origin isolated context.
      - run: cp web/deploy/.htaccess web/dist/.htaccess
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=cli/
          path: web/dist/
          remote_path: ${{ secrets.HOSTINGER_REMOTE_PATH }}
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: ${{ secrets.HOSTINGER_PORT }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}
