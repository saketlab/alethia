name: Deploy

# One workflow assembles the whole site and rsyncs it once. Three workflows each
# syncing their own subtree would need --delete scoped per directory to avoid
# deleting each other's output.
#
#   /             the browser app  (web/,  vite)
#   /cli/python   the Python docs  (docs/, mkdocs)
#   /cli/R        the R reference  (R/,    pkgdown)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npx vite build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with: {name: site-web, path: web/dist/, retention-days: 7}

  python-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "./python[docs]"
      # Notebooks render from committed outputs (mkdocs-jupyter execute=false),
      # so no embedding backend is installed here.
      - run: scripts/build_docs.sh --strict
      - uses: actions/upload-artifact@v4
        with: {name: site-python, path: site/, retention-days: 7}

  r-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R
          extra-packages: any::pkgdown, local::.
          needs: website
      - run: Rscript -e 'pkgdown::build_site(".", preview = FALSE, install = FALSE)'
        working-directory: R
      # pkgdown renders every root .md; this one is agent instructions.
      - run: rm -f R/docs/CLAUDE.html
      - uses: actions/upload-artifact@v4
        with: {name: site-r, path: R/docs/, retention-days: 7}

  publish:
    needs: [web, python-docs, r-docs]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: site-web, path: site}
      - uses: actions/download-artifact@v4
        with: {name: site-python, path: site/cli/python}
      - uses: actions/download-artifact@v4
        with: {name: site-r, path: site/cli/R}

      # ONNX Runtime uses multi-threaded wasm only in a cross-origin isolated
      # context, so the app runs single-threaded without these headers.
      - name: Add headers and verify the tree
        run: |
          cp web/deploy/.htaccess site/.htaccess
          test -f site/index.html
          test -f site/cli/python/index.html
          test -f site/cli/R/index.html

      - name: Deploy to Hostinger
        if: env.HOSTINGER_REMOTE_PATH != ''
        env:
          HOSTINGER_REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH }}
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: site/
          remote_path: ${{ secrets.HOSTINGER_REMOTE_PATH }}
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: ${{ secrets.HOSTINGER_PORT }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}
