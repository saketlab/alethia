site_name: alethia for Python
site_url: https://alethia.saketlab.org/cli/python/
site_description: >-
  Entity matching, standardization, and label-free embedding-model assessment,
  using semantic similarity from language model embeddings.
docs_dir: docs
repo_url: https://github.com/saketlab/alethia
repo_name: saketlab/alethia

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Geist
    code: Geist Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocs-jupyter:
      execute: false

extra:
  home_title: alethia - label-free entity matching and embedding-model assessment
  # notebooks cannot carry front matter, so their descriptions live here
  descriptions:
    "": Matching, label-free model choice, and clustering, on small examples.
  social:
    - icon: material/web
      link: https://alethia.saketlab.org/
      name: alethia in the browser
    - icon: fontawesome/brands/r-project
      link: https://alethia.saketlab.org/cli/R/
      name: alethia for R
    - icon: fontawesome/regular/building
      link: https://github.com/saketlab
      name: saketlab

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Quickstart: index.ipynb
  - Web app: https://alethia.saketlab.org/
  - alethia for R: https://alethia.saketlab.org/cli/R/
